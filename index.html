<!doctype html><html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>位置小達人</title>
<style>
:root{--blue:#075da8;--yellow:#f4b322;--green:#27754e;--red:#a33247;--paper:#fffdf7;--ink:#20292d;--line:#d8d4c9;--space:16px}*{box-sizing:border-box}body{margin:0;background:#f3f0e7;color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-size:18px}.app{width:min(1100px,calc(100% - 24px));margin:18px auto}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.title{display:flex;align-items:center;gap:12px}h1{font-size:clamp(26px,4vw,40px);margin:0}.sub{margin:2px 0;color:#556167}.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;box-shadow:0 12px 32px rgba(50,45,30,.12);overflow:hidden}.tabs{display:flex;gap:8px;padding:12px;border-bottom:1px solid var(--line)}button{font:inherit;cursor:pointer;min-height:48px}.tab,.btn{border:0;border-radius:999px;padding:8px 20px;font-weight:800}.tab{background:transparent}.tab.on,.btn{background:var(--blue);color:white}.sceneBox{padding:16px}.scene{position:relative;overflow:hidden;border-radius:16px;background:#d9eef8}.scene img{display:block;width:100%;height:auto}.arrow{position:absolute;right:2%;top:2%;background:rgba(255,255,255,.94);padding:7px 13px;border-radius:999px;font-weight:900;color:#17445e}.person{position:absolute;top:23%;height:65%;border:0;background:transparent;border-radius:14px}.person:hover,.person:focus{outline:5px solid var(--yellow);background:rgba(244,179,34,.18)}.person:after{content:attr(data-name);position:absolute;bottom:1%;left:50%;transform:translateX(-50%);background:white;border:2px solid #24323b;border-radius:999px;padding:2px 7px;font-size:14px;font-weight:900;white-space:nowrap}.pink{left:3%;width:17%}.yellow{left:26%;width:15%}.purple{left:47%;width:14%}.red{left:70%;width:15%}.person.ref{outline:6px solid var(--blue);background:rgba(7,93,168,.16)}.person.good{outline:7px solid var(--green);background:rgba(39,117,78,.2)}.person.bad{outline:7px solid var(--red);background:rgba(163,50,71,.2)}.learn{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px}.concept{background:#f0eee7;border-radius:16px;padding:18px}.concept h2{font-size:30px;color:var(--blue);margin:0 0 4px}.concept p{margin:5px 0 14px}.demo{border:2px solid var(--blue);color:var(--blue);background:white;border-radius:10px;padding:8px 15px;font-weight:800}.practice{padding-bottom:16px}.status{display:flex;justify-content:space-between;padding:14px 20px;background:#f0eee7;font-weight:800}.prompt{padding:18px 20px}.qrow{display:flex;align-items:flex-start;gap:12px}.speak{flex:0 0 52px;border:1px solid var(--line);border-radius:50%;background:white;font-size:24px}.question{font-size:clamp(21px,3vw,29px);font-weight:900;margin:0}.hint{color:#59656a;margin:4px 0}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}.choice{border:3px solid var(--blue);color:var(--blue);background:white;border-radius:12px;font-size:24px;font-weight:900}.feedback{margin-top:14px;padding:12px 15px;border-radius:10px;font-weight:900}.feedback:empty{display:none}.ok{background:#dff2e7;color:var(--green)}.try{background:#f6e2e5;color:var(--red)}.actions{display:flex;justify-content:flex-end;margin-top:14px}.btn:disabled{opacity:.4}.finish{text-align:center;padding:40px}.stars{font-size:48px;color:var(--yellow)}.hide{display:none!important}@media(max-width:650px){body{font-size:16px}.app{width:calc(100% - 12px);margin:6px auto}.sub{display:none}.sceneBox{padding:6px}.learn{grid-template-columns:1fr}.choices{grid-template-columns:1fr}.person:after{font-size:11px;padding:1px 4px}.arrow{font-size:12px}.status{flex-direction:column;gap:4px}}
</style></head><body><div class="app"><header class="head"><div class="title"><svg width="50" height="50" viewBox="0 0 50 50" aria-hidden="true"><circle cx="12" cy="25" r="7" fill="#f4b322"/><path d="M9 25h31m-9-10 10 10-10 10" fill="none" stroke="#075da8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg><div><h1>位置小達人</h1><p class="sub">前面、後面、最前、最後</p></div></div></header><main class="card"><nav class="tabs"><button id="learnTab" class="tab on">1. 先學習</button><button id="playTab" class="tab">2. 做練習</button></nav><section class="sceneBox"><div class="scene"><img id="queueImage" src="queue.jpg" width="1672" height="939" alt="四位學生面向右方，在巴士站排隊。"><div class="arrow">隊伍向前 ➜ 巴士站</div><button class="person pink" data-id="pink" data-name="粉紅衣" aria-label="粉紅衣女孩"></button><button class="person yellow" data-id="yellow" data-name="黃衣" aria-label="黃衣男孩"></button><button class="person purple" data-id="purple" data-name="紫衣" aria-label="紫衣女孩"></button><button class="person red" data-id="red" data-name="紅衣" aria-label="紅衣男孩"></button></div></section><section id="learn" class="learn"><article class="concept"><h2>最前</h2><p>最接近巴士站的人。</p><button class="demo" data-show="red" data-say="紅衣男孩站在整條隊伍的最前。">看「最前」</button></article><article class="concept"><h2>最後</h2><p>離巴士站最遠的人。</p><button class="demo" data-show="pink" data-say="粉紅衣女孩站在整條隊伍的最後。">看「最後」</button></article><article class="concept"><h2>前面</h2><p>紫衣女孩在黃衣男孩的前面。</p><button class="demo" data-show="purple" data-ref="yellow" data-say="紫衣女孩在黃衣男孩的前面。">看「前面」</button></article><article class="concept"><h2>後面</h2><p>黃衣男孩在紫衣女孩的後面。</p><button class="demo" data-show="yellow" data-ref="purple" data-say="黃衣男孩在紫衣女孩的後面。">看「後面」</button></article></section><section id="practice" class="practice hide"><div class="status"><span id="step"></span><span id="score">答對 0 題</span></div><div class="prompt"><div class="qrow"><button id="speak" class="speak" aria-label="朗讀題目">🔊</button><div><p id="question" class="question"></p><p id="hint" class="hint"></p></div></div><div id="choices" class="choices"></div><div id="feedback" class="feedback" role="status"></div><div class="actions"><button id="next" class="btn" disabled>下一題</button></div></div></section><section id="finish" class="finish hide"><div class="stars">★ ★ ★</div><h2>完成了！</h2><p>你認識四個位置了。</p><button id="again" class="btn">再玩一次</button></section></main></div>
<script>
const P=[...document.querySelectorAll('.person')],L=document.querySelector('#learn'),G=document.querySelector('#practice'),F=document.querySelector('#finish');let n=0,score=0,locked=false;
const Q=[{t:'p',q:'誰站在整條隊伍的最前？',h:'找最接近巴士站的人。',a:'red',o:'紅衣男孩站在最前。'},{t:'p',q:'誰站在整條隊伍的最後？',h:'找離巴士站最遠的人。',a:'pink',o:'粉紅衣女孩站在最後。'},{t:'c',q:'紫衣女孩在黃衣男孩的哪裏？',h:'先比較兩個人。',r:'yellow',c:['前面','後面'],a:'前面',o:'紫衣女孩在黃衣男孩的前面。'},{t:'c',q:'黃衣男孩在紫衣女孩的哪裏？',h:'先比較兩個人。',r:'purple',c:['前面','後面'],a:'後面',o:'黃衣男孩在紫衣女孩的後面。'},{t:'c',q:'看整條隊伍，紅衣男孩在哪裏？',h:'「最前」要看整條隊伍。',c:['最前','前面'],a:'最前',o:'看整條隊伍，要說最前。'},{t:'c',q:'紫衣女孩在黃衣男孩前面。她是整條隊伍的最前嗎？',h:'最前只有一個人。',r:'purple',c:['是','不是'],a:'不是',o:'她在黃衣男孩前面，但紅衣男孩才是最前。'},{t:'p',q:'找出黃衣男孩前面的紫衣女孩。',h:'先找黃衣男孩。',r:'yellow',a:'purple',o:'紫衣女孩在黃衣男孩前面。'},{t:'p',q:'找出站在整條隊伍最後的人。',h:'「最後」要看整條隊伍。',a:'pink',o:'粉紅衣女孩站在最後。'}];
function say(x){if(!speechSynthesis)return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(x);u.lang='zh-HK';u.rate=.82;speechSynthesis.speak(u)}function clear(){P.forEach(x=>x.classList.remove('ref','good','bad'))}function mark(id,c){document.querySelector('[data-id="'+id+'"]').classList.add(c)}
function mode(play){L.classList.toggle('hide',play);G.classList.toggle('hide',!play);F.classList.add('hide');document.querySelector('#learnTab').classList.toggle('on',!play);document.querySelector('#playTab').classList.toggle('on',play);clear();if(play){draw();say(Q[n].q+' '+Q[n].h)}}
function draw(){locked=false;clear();let x=Q[n];document.querySelector('#step').textContent='第 '+(n+1)+' 題，共 '+Q.length+' 題';document.querySelector('#score').textContent='答對 '+score+' 題';document.querySelector('#question').textContent=x.q;document.querySelector('#hint').textContent=x.h;let f=document.querySelector('#feedback');f.textContent='';f.className='feedback';document.querySelector('#next').disabled=true;document.querySelector('#next').textContent=n===Q.length-1?'完成':'下一題';let box=document.querySelector('#choices');box.innerHTML='';if(x.r)mark(x.r,'ref');P.forEach(p=>p.disabled=x.t!=='p');if(x.t==='c')x.c.forEach(v=>{let b=document.createElement('button');b.className='choice';b.textContent=v;b.onclick=()=>answer(v,b);box.appendChild(b)})}
function answer(v,b){if(locked)return;let x=Q[n],f=document.querySelector('#feedback');if(v===x.a){locked=true;score++;if(x.t==='p')mark(v,'good');if(b)b.style.background='#dff2e7';f.textContent='✓ 答對了！'+x.o;f.className='feedback ok';document.querySelector('#next').disabled=false;say('答對了。'+x.o)}else{if(x.t==='p'){mark(v,'bad');setTimeout(()=>document.querySelector('[data-id="'+v+'"]').classList.remove('bad'),600)}f.textContent='再想一想，看看巴士站的方向。';f.className='feedback try';say(f.textContent)}}
P.forEach(p=>p.onclick=()=>{if(!G.classList.contains('hide')&&Q[n].t==='p')answer(p.dataset.id)});document.querySelectorAll('.demo').forEach(b=>b.onclick=()=>{clear();mark(b.dataset.show,'good');if(b.dataset.ref)mark(b.dataset.ref,'ref');say(b.dataset.say)});document.querySelector('#learnTab').onclick=()=>mode(false);document.querySelector('#playTab').onclick=()=>mode(true);document.querySelector('#speak').onclick=()=>say(Q[n].q+' '+Q[n].h);document.querySelector('#next').onclick=()=>{if(!locked)return;if(n<Q.length-1){n++;draw();say(Q[n].q+' '+Q[n].h)}else{G.classList.add('hide');F.classList.remove('hide');clear();say('完成了！')}};document.querySelector('#again').onclick=()=>{n=0;score=0;F.classList.add('hide');G.classList.remove('hide');draw()};
</script></body></html>
